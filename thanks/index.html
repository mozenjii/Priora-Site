<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thanks | Priora</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: light;
        --bg: #f7f3eb;
        --text: #111111;
        --muted: #5c646c;
        --accent: #26c17d;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "Manrope", sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at top right, rgba(38, 193, 125, 0.14), transparent 26%),
          linear-gradient(180deg, #fbf8f1 0%, var(--bg) 100%);
        padding: 24px;
      }
      .card {
        width: min(760px, 100%);
        padding: 36px;
        border-radius: 32px;
        background: rgba(255, 255, 255, 0.82);
        border: 1px solid rgba(17, 17, 17, 0.08);
        box-shadow: 0 24px 80px rgba(23, 27, 31, 0.09);
      }
      .eyebrow {
        color: #176f49;
        font-size: 0.82rem;
        font-weight: 800;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }
      h1 {
        margin: 16px 0 0;
        font: 700 clamp(2.2rem, 5vw, 4rem) "Space Grotesk", sans-serif;
        letter-spacing: -0.045em;
        line-height: 0.95;
      }
      p {
        margin: 18px 0 0;
        color: var(--muted);
        line-height: 1.7;
        font-size: 1.02rem;
      }
      a {
        display: inline-flex;
        margin-top: 28px;
        padding: 14px 18px;
        border-radius: 999px;
        color: white;
        background: var(--text);
        text-decoration: none;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="eyebrow">Submission received</div>
      <h1>Thanks. We got your Priora request.</h1>
      <p>Your request has been sent and routed to the Priora team.</p>
      <p>If you included a note, we’ll use it to route the conversation to the right person.</p>
      <a href="/">Back to Priora</a>
    </main>
  </body>
</html>
